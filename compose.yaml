services:
  db:
    image: postgres:16-alpine
    container_name: wms-postgres
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - wms-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  db-init:
    image: postgres:16-alpine
    container_name: wms-postgres-init
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGPASSWORD: postgres
    command: >
      sh -c "
      psql -h db -U postgres -d postgres -tc \"SELECT 1 FROM pg_roles WHERE rolname = 'wms'\" | grep -q 1 ||
      psql -h db -U postgres -d postgres -c \"CREATE ROLE wms WITH LOGIN PASSWORD 'wms'\";
      psql -h db -U postgres -d postgres -tc \"SELECT 1 FROM pg_database WHERE datname = 'wms'\" | grep -q 1 ||
      psql -h db -U postgres -d postgres -c \"CREATE DATABASE wms OWNER wms\";
      psql -h db -U postgres -d postgres -c \"ALTER DATABASE wms OWNER TO wms\";
      "
    restart: "no"

volumes:
  wms-postgres-data:
