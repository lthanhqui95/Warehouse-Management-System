services:
  db:
    image: postgres:16-alpine
    container_name: wms-postgres
    environment:
      POSTGRES_DB: wms
      POSTGRES_USER: wms
      POSTGRES_PASSWORD: wms
    ports:
      - "5432:5432"
    volumes:
      - wms-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wms -d wms"]
      interval: 10s
      timeout: 5s
      retries: 5

  db-init:
    image: postgres:16-alpine
    container_name: wms-postgres-init
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGPASSWORD: ${DB_ADMIN_PASSWORD:-postgres}
    command: >
      sh -c "
      psql -h db -U ${DB_ADMIN_USERNAME:-postgres} -d ${DB_ADMIN_DATABASE:-postgres} -tc \"SELECT 1 FROM pg_roles WHERE rolname = 'wms'\" | grep -q 1 ||
      psql -h db -U ${DB_ADMIN_USERNAME:-postgres} -d ${DB_ADMIN_DATABASE:-postgres} -c \"CREATE ROLE wms WITH LOGIN PASSWORD 'wms'\";
      psql -h db -U ${DB_ADMIN_USERNAME:-postgres} -d ${DB_ADMIN_DATABASE:-postgres} -tc \"SELECT 1 FROM pg_database WHERE datname = 'wms'\" | grep -q 1 ||
      psql -h db -U ${DB_ADMIN_USERNAME:-postgres} -d ${DB_ADMIN_DATABASE:-postgres} -c \"CREATE DATABASE wms OWNER wms\";
      psql -h db -U ${DB_ADMIN_USERNAME:-postgres} -d ${DB_ADMIN_DATABASE:-postgres} -c \"ALTER DATABASE wms OWNER TO wms\";
      "
    profiles: ["legacy-db-repair"]
    restart: "no"

volumes:
  wms-postgres-data:
